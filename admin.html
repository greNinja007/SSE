<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSE SMART MANAGER - Admin Dashboard</title>
    <link rel="stylesheet" href="/css/admin.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
  </head>
  <body>
    <div class="container">
      <div class="screen">
        <div class="screen__content">
          <header class="admin-header">
            <div class="welcome-message" id="welcomeMessage">
              <i class="fas fa-user-shield"></i> Loading...
            </div>
            <button id="logoutButton" class="logout-button">
              <i class="fas fa-sign-out-alt"></i>
            </button>
          </header>

          <main class="admin-dashboard">
            <h1 class="dashboard-title">Admin Dashboard</h1>

            <div class="button-grid">
              <button class="admin-button" data-url="/employee-management">
                <i class="fas fa-users-cog"></i>
                <span>Manage Employees</span>
              </button>
              <button class="admin-button" data-url="/manage-checklist">
                <i class="fas fa-clipboard-list"></i>
                <span>Manage Checklist</span>
              </button>
              <button class="admin-button" data-url="/edit-checklist">
                <i class="fas fa-edit"></i>
                <span>Edit Checklist</span>
              </button>
            </div>
          </main>
        </div>
        <div class="screen__background">
          <span
            class="screen__background__shape screen__background__shape4"
          ></span>
          <span
            class="screen__background__shape screen__background__shape3"
          ></span>
          <span
            class="screen__background__shape screen__background__shape2"
          ></span>
          <span
            class="screen__background__shape screen__background__shape1"
          ></span>
        </div>
      </div>
    </div>
    <script src="/js/admin.js" type="module"></script>
  </body>
</html>
