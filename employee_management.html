<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSE SMART MANAGER - Employee Management</title>
    <link rel="stylesheet" href="css/employee_management.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <header class="page-header">
        <button id="back-btn" class="back-btn">
          <i class="fas fa-arrow-left"></i> Back
        </button>
        <h1 class="page-title">Employee Management</h1>
      </header>

      <main class="content-wrapper">
        <section class="form-section">
          <form id="employee-form" class="employee-form">
            <h2 class="form-title">Add/Edit Employee</h2>
            <div
              id="form-error"
              class="error-message"
              style="display: none"
            ></div>

            <div class="form-group">
              <label for="employee_name">Employee Name:</label>
              <input
                type="text"
                id="employee_name"
                name="employee_name"
                required
              />
            </div>

            <div class="form-group">
              <label for="email">Email:</label>
              <input type="email" id="email" name="email" required />
            </div>

            <div class="form-group">
              <label for="phone">Phone No:</label>
              <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="10-digit number (no country code)"
                pattern="[0-9]{10}"
                required
                maxlength="10"
              />
            </div>

            <div class="form-group">
              <label for="designation">Designation:</label>
              <div class="designation-container">
                <input
                  type="text"
                  id="designation"
                  name="designation"
                  placeholder="Select Designation"
                  autocomplete="off"
                  required
                />
                <div id="designation-options" class="dropdown-options"></div>
              </div>
            </div>

            <button type="submit" class="submit-btn">
              <span id="submit-text">Save Employee</span>
              <i
                class="fas fa-spinner fa-spin"
                id="submit-spinner"
                style="display: none"
              ></i>
            </button>
          </form>
        </section>
      </main>

      <!-- Floating Action Buttons -->
      <div class="fab-container">
        <button class="fab-btn" id="show-db-btn" title="View Database">
          <i class="fas fa-database"></i>
        </button>
        <button class="fab-btn" id="csv-btn" title="Upload CSV">
          <i class="fas fa-file-csv"></i>
        </button>
      </div>

      <!-- Database Modal -->
      <div id="db-modal" class="modal">
        <div class="modal-content" onclick="event.stopPropagation()">
          <div class="modal-header">
            <h2>Employee Database</h2>
            <span class="close-btn" id="close-db-btn">&times;</span>
          </div>
          <div class="search-container">
            <input
              type="text"
              id="search-input"
              placeholder="Search by name or email..."
            />
            <button id="search-icon" class="search-btn">
              <i class="fas fa-search"></i>
            </button>
          </div>
          <div class="table-container">
            <table id="employee-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Designation</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- CSV Upload Modal -->
      <div id="csv-modal" class="modal">
        <div class="modal-content" onclick="event.stopPropagation()">
          <div class="modal-header">
            <h2>Upload CSV File</h2>
            <span class="close-btn" id="close-csv-btn">&times;</span>
          </div>
          <div class="file-upload-container">
            <label for="csv-input" class="file-upload-label">
              <span class="upload-content">
                <i class="fas fa-cloud-upload-alt"></i>
                Choose CSV Files
              </span>
              <input
                type="file"
                id="csv-input"
                name="csvFile"
                accept=".csv"
                style="display: none"
              />
            </label>
            <button id="upload-csv-btn" class="upload-btn">
              <i class="fas fa-upload"></i> Upload
            </button>
          </div>
          <div id="csv-upload-status" class="upload-status"></div>
        </div>
      </div>
    </div>

    <script src="js/employee_management.js" type="module"></script>
  </body>
</html>
